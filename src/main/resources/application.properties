spring.application.name=StudyManagement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studymanagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:91ee9c4b064ee49b252abaf692bdf28166257b193b3125556f025ab5e053e901}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.upload.dir=${UPLOAD_DIR:uploads}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.local-dir=${UPLOAD_DIR:uploads}
app.storage.max-avatar-size=${MAX_AVATAR_SIZE:2097152}
app.storage.max-image-size=${MAX_IMAGE_SIZE:5242880}
app.storage.max-document-size=${MAX_DOCUMENT_SIZE:10485760}
app.storage.max-zip-size=${MAX_ZIP_SIZE:104857600}
app.storage.gcs.bucket=${GCS_BUCKET:}
app.storage.gcs.project-id=${GCS_PROJECT_ID:}
app.storage.signed-url-expiration-minutes=${SIGNED_URL_EXPIRATION_MINUTES:5}
